name: Deploy to VPS

# Pull-based deploy (od 2026-07-02, migrace na edi06):
# GH Actions nemuze SSH na edi06 - firewall povoluje SSH jen z CZ/SK IP.
# Server si novy master stahuje sam cronem (/root/bin/keep-brain-autodeploy.sh,
# kazde 2 minuty: git pull + npm ci + prisma + build + pm2 restart + healthcheck).
# Po uspesnem nasazeni zapise SHA do public/version.txt, ktery nginx serviruje
# na https://keep.muzx.cz/version.txt. Tento workflow jen overi, ze se tam
# pushnuty commit skutecne objevil.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for server to deploy this commit
        run: |
          echo "Expecting SHA: $GITHUB_SHA"
          # cron bezi kazde 2 min, deploy (npm ci + build) trva ~3-6 min
          for i in $(seq 1 45); do
            DEPLOYED=$(curl -s -m 15 https://keep.muzx.cz/version.txt || echo "unreachable")
            if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
              echo "Deployed OK after ~$((i*20))s"
              exit 0
            fi
            echo "try $i/45: deployed=$DEPLOYED"
            sleep 20
          done
          echo "::error::Server did not deploy $GITHUB_SHA within 15 minutes"
          echo "Check on server: tail -50 /var/log/keep-brain-autodeploy.log"
          exit 1

      - name: Health check
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://keep.muzx.cz/api/health)
          BODY=$(curl -s -m 15 https://keep.muzx.cz/api/health)
          echo "health: $HTTP $BODY"
          [ "$HTTP" = "200" ] || exit 1
