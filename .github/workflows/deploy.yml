name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Migrated 2026-07-02: app lives on edi06 (DNS for keep.muzx.cz points here).
          # Hostname is public DNS - no secret needed; VPS_HOST secret still holds old dvi12.
          host: edi06.vas-server.cz
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e

            cd /www/hosting/muzx.cz/keep

            echo "=== Pulling latest changes ==="
            git pull origin master

            echo "=== Installing dependencies ==="
            npm ci --production=false

            echo "=== Generating Prisma client ==="
            npx prisma generate

            echo "=== Running database migrations ==="
            npx prisma migrate deploy

            echo "=== Building Next.js ==="
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build

            echo "=== Updating Python worker ==="
            cd worker
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            deactivate
            cd ..

            echo "=== Restarting PM2 processes ==="
            pm2 restart keep-brain --update-env
            pm2 restart keep-brain-worker --update-env
            pm2 restart keep-brain-ai-worker --update-env

            echo "=== Waiting for startup ==="
            sleep 5

            echo "=== Health check ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3011/api/health)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Health check failed with status $HTTP_STATUS"
              pm2 status
              curl -s http://localhost:3011/api/health || true
              exit 1
            fi

            echo "=== Checking PM2 status ==="
            pm2 status

            echo "=== Deploy completed! ==="
