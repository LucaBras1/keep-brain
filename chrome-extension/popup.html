<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    h2 {
      margin-top: 0;
      color: #111;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 10px;
      height: 10px;
      background: #7c3aed;
      border-radius: 50%;
      display: inline-block;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #666;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #7c3aed;
    }
    button {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #6d28d9;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    .instructions {
      font-size: 11px;
      color: #666;
      line-height: 1.4;
      margin-top: 16px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <h2><span class="logo-dot"></span> Keep Brain Sync</h2>

  <div class="form-group">
    <label for="serverUrl">Keep Brain URL Serveru</label>
    <input type="text" id="serverUrl" value="http://localhost:3011" placeholder="https://keep.muzx.cz">
  </div>

  <button id="syncBtn">Synchronizovat poznámky</button>

  <div id="status"></div>

  <div class="instructions">
    <strong>Návod:</strong>
    <ol style="margin: 4px 0; padding-left: 16px;">
      <li>Otevřete záložku <a href="https://keep.google.com" target="_blank">keep.google.com</a>.</li>
      <li>Ujistěte se, že jste přihlášeni ve svém Keep Brain účtu na zadané URL.</li>
      <li>Klikněte na tlačítko "Synchronizovat poznámky" výše.</li>
    </ol>
  </div>

  <script src="popup.js"></script>
</body>
</html>
